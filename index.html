<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Everyone's coming to the Algarve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Pinyon+Script&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <!-- Loading screen: styled inline so it shows the instant the HTML arrives, before any JS or CSS bundle.
       src/main.js moves the bar through the real loading stages and fades it out once the map has drawn. -->
  <style>
    html, body { margin: 0; height: 100%; background: #efe7da; }
    #loader { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center;
              gap: 16px; background: #efe7da; transition: opacity .7s ease; }
    #loader.done { opacity: 0; pointer-events: none; }
    #loader svg { width: 46px; height: 46px; border-radius: 4px; box-shadow: 0 1px 2px rgba(74,59,47,.15), 0 6px 18px rgba(74,59,47,.12);
                  animation: tile 3.2s ease-in-out infinite; }
    @keyframes tile { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
    #loader .title { font: 400 22px/1.1 "Instrument Serif", Georgia, serif; letter-spacing: .04em; text-transform: uppercase; color: #c2541f; text-align: center; }
    #loader .bar { width: min(240px, 60vw); height: 3px; border-radius: 2px; background: rgba(30,75,184,.14); overflow: hidden; }
    #loader .bar i { display: block; height: 100%; width: 6%; border-radius: 2px; background: #1e4bb8; transition: width .6s ease; }
    #loader .step { font: 500 9px/1 Inter, system-ui, sans-serif; letter-spacing: .26em; text-transform: uppercase; color: #7f8f5f; min-height: 9px; }
    @media (prefers-reduced-motion: reduce) { #loader svg { animation: none; } }
  </style>
</head>
<body>

<div id="loader" role="progressbar" aria-label="Loading the map" aria-valuemin="0" aria-valuemax="100" aria-valuenow="6">
  <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" fill="#fbf7f0"/><g fill="#1e4bb8"><ellipse cx="20" cy="11" rx="3.2" ry="6"/><ellipse cx="20" cy="29" rx="3.2" ry="6"/><ellipse cx="11" cy="20" rx="6" ry="3.2"/><ellipse cx="29" cy="20" rx="6" ry="3.2"/><circle cx="0" cy="0" r="6"/><circle cx="40" cy="0" r="6"/><circle cx="0" cy="40" r="6"/><circle cx="40" cy="40" r="6"/></g><circle cx="20" cy="20" r="3.4" fill="#fbf7f0"/><circle cx="20" cy="20" r="1.6" fill="#c2541f"/><g fill="#fbf7f0"><circle cx="0" cy="0" r="2.4"/><circle cx="40" cy="0" r="2.4"/><circle cx="0" cy="40" r="2.4"/><circle cx="40" cy="40" r="2.4"/></g></svg>
  <div class="title">Everyone's coming<br>to the Algarve</div>
  <div class="bar"><i id="loaderBar"></i></div>
  <div class="step" id="loaderStep">Unpacking the map</div>
</div>

<arcgis-map id="map" popup-component-enabled>
  <!-- Anything placed in a slot is laid out by the map's UI, just like Esri's own components -->
  <div slot="top-left" id="head" class="paper">
    <div class="tiles"></div>
    <div class="inner">
      <div class="caps">Good people · good food · great company</div>
      <h1>Everyone's coming<br>to the Algarve</h1>
      <div class="script">from all over the world</div>
      <div class="legend" id="sideLegend"></div>
    </div>
  </div>
  <arcgis-zoom slot="top-right"></arcgis-zoom>
  <arcgis-home slot="top-right"></arcgis-home>
  <arcgis-expand slot="top-right" expand-icon="palette" expand-tooltip="Design variants" mode="floating">
    <div id="design"></div>
  </arcgis-expand>
  <arcgis-expand slot="bottom-left" expand-icon="legend" expand-tooltip="Legend">
    <arcgis-legend></arcgis-legend>
  </arcgis-expand>
</arcgis-map>

<div id="stats" class="paper">
  <div class="stat"><b id="sGuests">0</b><span>guests</span></div>
  <div class="stat"><b id="sCountries">0</b><span>countries</span></div>
  <div class="stat"><b id="sKm">0</b><span>km travelled</span></div>
</div>
<div id="msg" class="paper"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
